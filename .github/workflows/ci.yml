name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Binary
        run: go build -o dummy-server.bin .

      - name: Simple Test
        run: |
          ./dummy-server.bin &
          sleep 3
          curl -s http://localhost:8080
          kill $!

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary
          path: ./dummy-server.bin
